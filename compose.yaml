services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-plse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-defaultTestPassword}
      POSTGRES_DB: ${DB_NAME:-expunger_db}
    ports:
      - 5432:5432
    # -h forces a TCP check. During first-run initialization the image
    # starts a temporary server on the unix socket only, which a socket
    # check would report as ready before the database is really up.
    healthcheck:
      test: pg_isready -h 127.0.0.1 -U ${DB_USER:-plse} -d ${DB_NAME:-expunger_db}
      interval: 1s
      timeout: 5s
      retries: 15
    restart: on-failure
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./
      dockerfile: ./Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    image: pa_expunger-backend:dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-key_that_is_long_enough_to_not_get_a_warning}
      DB_NAME: ${DB_NAME:-expunger_db}
      DB_USER: ${DB_USER:-plse}
      DB_PASSWORD: ${DB_PASSWORD:-defaultTestPassword}
      DB_HOST: postgres
      DB_PORT: 5432
      SUPERUSER_USERNAME: ${SUPERUSER_USERNAME:-plse}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-defaultTestPassword}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    ports:
      - 8000:8000
    volumes:
      - ./platform/src:/app/src
      - ./platform/docket_parser:/app/docket_parser
    restart: on-failure
    # No curl in python:3.12-slim; urllib is stdlib. Without this, `docker compose
    # up -d --wait` (and plain `up -d`) reports "running" as soon as the process
    # starts, which can be before dev_entrypoint.sh finishes migrate/ensure_superuser/
    # seed_dev_data -- a race pytest can lose if it starts exec'ing immediately after.
    # readiness over liveness: it also checks Database, which is a stronger signal
    # that the app can actually serve traffic.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/readiness/')"]
      interval: 2s
      timeout: 5s
      retries: 60

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pa_expunger-frontend:dev
    stdin_open: true
    tty: true
    environment:
      NODE_ENV: development
      VITE_BACKEND_HOST: http://localhost:8000
      CI: "false"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - 3000:3000
    volumes: # not the whole /frontend/src directory because it would overwrite src/.yarn
      - ./frontend/src/src:/app/src
      - ./frontend/src/public:/app/src/public
    restart: on-failure
volumes:
  postgres_data:
