# Values for local testing. Pair with the manifests in k8s-e2e-test/, which supply the two
# things this chart deliberately leaves to the environment: routing (Envoy Gateway plus a
# Gateway/HTTPRoute for localhost, mirroring _gateways/pa-expunger.yaml) and a database
# (a throwaway Postgres standing in for the sandbox's shared CloudNativePG cluster).

# Must be exactly "localhost" while secrets.create is true; the dummy-secrets template
# fails the render otherwise, so this file cannot be aimed at a real deployment.
publicHostname: localhost

# Matches the Service in k8s-e2e-test/postgres.yaml. The sandbox sets this to
# shared-cluster-rw.cloudnative-pg.svc.cluster.local instead.
externalDatabase:
  host: pa-expunger-local-postgres

backend:
  image:
    repository: pa_expunger-backend
    tag: "e2e-test"
    pullPolicy: Never

  config:
    DJANGO_LOG_LEVEL: "INFO"

secrets:
  create: true
