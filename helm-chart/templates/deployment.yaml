apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DB_HOST
              value: {{ include "pa-expunger.dbHost" . }}
            - name: DJANGO_LOG_LEVEL
              value: {{ .Values.backend.config.DJANGO_LOG_LEVEL | quote }}
            - name: DJANGO_ALLOWED_HOSTS
              value: {{ include "pa-expunger.allowedHosts" . | quote }}
            - name: BACKEND_API_URL
              value: {{ include "pa-expunger.backendApiUrl" . | quote }}
            - name: HELM_APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            # Deliberately not set on the migration Job: its name is keyed on the image
            # tag alone, so a chart version bump with no appVersion bump would change an
            # existing Job's immutable pod template and fail the apply.
            - name: HELM_CHART_VERSION
              value: {{ .Chart.Version | quote }}

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: {{ include "pa-expunger.postgresSecretName" . | quote }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_DB
                  name: {{ include "pa-expunger.postgresSecretName" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: {{ include "pa-expunger.postgresSecretName" . | quote }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Only DJANGO_SECRET_KEY, not the whole backend secret: SUPERUSER_USERNAME/
            # SUPERUSER_PASSWORD live in that secret too, for ensure_superuser in the
            # migration Job, and the app itself has no use for them. Keeping envFrom here
            # would put the admin password in every app pod's environment for no reason.
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: DJANGO_SECRET_KEY
                  name: {{ include "pa-expunger.backendSecretName" . | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
