{{- define "pa-expunger.migrationPodTemplate" -}}
spec:
  containers:
    - name: migrations
      image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
      envFrom:
        - secretRef:
            name: {{ include "pa-expunger.backendSecretName" . | quote }}
      env:
        - name: DB_HOST
          value: {{ include "pa-expunger.dbHost" . }}
        # Migrations never serve a request, but config.settings.prod raises at import
        # if this is unset, so the Job cannot even reach the database without it.
        - name: DJANGO_ALLOWED_HOSTS
          value: {{ include "pa-expunger.allowedHosts" . | quote }}
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: POSTGRES_USER
              name: {{ include "pa-expunger.postgresSecretName" . | quote }}
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              key: POSTGRES_DB
              name: {{ include "pa-expunger.postgresSecretName" . | quote }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: {{ include "pa-expunger.postgresSecretName" . | quote }}
      # command: overrides the image's ENTRYPOINT in a Pod spec (unlike Compose, where
      # it maps to CMD and the entrypoint still runs). This bypasses
      # prod_entrypoint.sh entirely. ensure_superuser must run after migrate, so both
      # are chained with && under a shell rather than expressed as a Kubernetes list:
      # `;` would let a failed migrate still run ensure_superuser, and `sh -c`
      # propagates the last command's exit status so Job failure detection still works.
      command: ["/bin/sh", "-c", "python manage.py migrate --noinput && python manage.py ensure_superuser"]
  # Never, not OnFailure: with OnFailure the failed pod and its logs are deleted once
  # backoffLimit is reached.
  restartPolicy: Never
{{- end -}}
{{- $podTemplate := include "pa-expunger.migrationPodTemplate" . -}}
{{- $templateHash := $podTemplate | sha256sum | trunc 8 -}}
{{- $tag := .Values.backend.image.tag | default .Chart.AppVersion | replace "." "-" | replace "+" "-" | trunc 45 | trimSuffix "-" -}}
{{- $jobName := printf "%s-migrations-t%s-%s" .Release.Name $templateHash $tag -}}
{{- $revision := .Values.backend.bootstrapRevision | default "" | toString -}}
{{- if $revision -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $revision) -}}
{{- fail (printf "FATAL: backend.bootstrapRevision %q must be lowercase letters, digits and '-', e.g. \"2\". Quote it in YAML so it stays a string." $revision) -}}
{{- end -}}
{{- $jobName = printf "%s-r%s" $jobName $revision -}}
{{- end -}}
{{- if gt (len $jobName) 63 -}}
{{- fail (printf "FATAL: migration Job name %q is %d characters, over Kubernetes' 63. Shorten backend.bootstrapRevision or backend.image.tag." $jobName (len $jobName)) -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  # A Job's spec.template is immutable, so the name includes a hash of the pod template:
  # any change to it creates a new Job instead of an apply error the GitOps deploy would
  # swallow. backend.bootstrapRevision, when set, adds "-r<revision>" to rerun the Job
  # with an unchanged template (e.g. after resealing SUPERUSER_PASSWORD). The old Job is
  # pruned when its manifest leaves the projection.
  #
  # No ttlSecondsAfterFinished. Each completed Job stays around indefinitely; this is
  # accepted clutter. A TTL would delete the Job object while the GitOps path keeps
  # applying the same rendered manifest. The next apply would then just recreate the Job
  # and rerun migrations that already succeeded.
  name: {{ $jobName | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  template:
    {{- $podTemplate | nindent 4 }}
  # About 50 minutes of retries, enough to wait out a database that is still starting.
  backoffLimit: 10
