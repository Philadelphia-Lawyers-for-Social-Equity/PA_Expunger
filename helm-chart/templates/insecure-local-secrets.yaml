{{- /*
This template creates dummy secrets for local testing ONLY.
It requires publicHostname to be exactly "localhost".
This ensures production deployments can't accidentally use it.
*/}}

{{- /* Run the fail-safe check first */}}
{{- if .Values.secrets.create }}
  {{- if not .Values.publicHostname }}
    {{- fail "FATAL: Dummy secrets (secrets.create=true) require publicHostname to be set to 'localhost'. This is a security risk. For production, set secrets.create to false and use SealedSecrets." }}
  {{- end }}
  {{- if ne .Values.publicHostname "localhost" }}
    {{- fail (printf "FATAL: Dummy secrets (secrets.create=true) are enabled, but publicHostname is '%s', not 'localhost'. This is a security risk. For production, set secrets.create to false and use SealedSecrets." .Values.publicHostname) }}
  {{- end }}
{{- end }}

{{- /* If the check passes, proceed with creating the secrets */}}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.backendSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  DJANGO_SECRET_KEY: {{ .Values.secrets.dummyData.djangoSecretKey | b64enc | quote }}
  SUPERUSER_USERNAME: {{ .Values.secrets.dummyData.superuserUsername | b64enc | quote }}
  SUPERUSER_PASSWORD: {{ .Values.secrets.dummyData.superuserPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.postgresSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.secrets.dummyData.postgresUser | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dummyData.postgresPassword | b64enc | quote }}
  POSTGRES_DB: {{ .Values.secrets.dummyData.postgresDb | b64enc | quote }}
---
{{- /*
A throwaway self-signed cert for the local Gateway's HTTPS listener, generated at
render time so no private key is ever committed to this repo.

The chart ships no routing resources, so nothing here consumes this Secret -- it
exists for local-test/gateway.yaml, whose certificateRefs names it. In the sandbox
the equivalent Secret is issued by cert-manager from the Gateway's cluster-issuer
annotation, so this template is never rendered there: it is gated behind
secrets.create, which the checks above pin to publicHostname == "localhost".

Envoy Gateway has no default-certificate fallback the way ingress-nginx did, so
without a resolvable certificateRefs the HTTPS listener never becomes ready.

genSelfSignedCert returns fresh key material on every render, which would hand the
Gateway a new cert on every `helm upgrade` and invalidate the browser exception you
just clicked through. Reusing the existing Secret when there is one keeps it stable.
`lookup` returns empty under `helm template` and `--dry-run`, so those paths always
generate -- fine, since nothing applies their output.
*/}}
{{- $tlsSecretName := printf "%s-tls" .Release.Name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $tlsSecretName) }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if and $existing $existing.data (index ($existing.data | default dict) "tls.crt") }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- else }}
{{- $cert := genSelfSignedCert "localhost" (list "127.0.0.1") (list "localhost") 3650 }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecretName }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | quote }}
  tls.key: {{ $key | quote }}
{{- end }}
