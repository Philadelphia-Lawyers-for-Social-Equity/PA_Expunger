services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD}
      POSTGRES_DB: ${TEST_DB_NAME}
    volumes:
      - postgres_test_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: pa_expunger-backend:latest
    environment:
      DB_HOST: postgres
      DB_USER: ${TEST_DB_USER}
      DB_PASSWORD: ${TEST_DB_PASSWORD}
      DB_NAME: ${TEST_DB_NAME}
      DB_PORT: 5432
      DJANGO_SECRET_KEY: ${TEST_DJANGO_SECRET_KEY}
      SUPERUSER_USERNAME: ${TEST_SUPERUSER_USERNAME}
      SUPERUSER_PASSWORD: ${TEST_SUPERUSER_PASSWORD}
      DJANGO_LOG_LEVEL: ${TEST_DJANGO_LOG_LEVEL}
      DJANGO_DEBUG: ${TEST_DJANGO_DEBUG}
      FRONTEND_URL: "http://localhost:8000"
      BACKEND_API_URL: "http://localhost:8000"
      DJANGO_ALLOWED_HOSTS: "localhost"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application"
      

volumes:
  postgres_test_prod_data:
