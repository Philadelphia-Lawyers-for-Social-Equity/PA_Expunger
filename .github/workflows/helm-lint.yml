name: Lint and render the Helm chart

on:
  pull_request:
    branches: [ "develop" ]
    paths:
      - "helm-chart/**"
      - ".github/workflows/helm-lint.yml"

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint the chart
        run: helm lint helm-chart -f helm-chart/ci-values.yaml

      # publicHostname and externalDatabase.host have no default and fail() the
      # render if unset, so both must be supplied for `helm template` to succeed.
      # ci-values.yaml is a minimal, CI-only file (not local-values.yaml, which is
      # the real local Kubernetes e2e config and changes for unrelated reasons) that
      # also sets secrets.create: true so insecure-local-secrets.yaml renders too.
      # This is the only CI check that would catch a quoting/list-shape mistake in
      # migration-job.yaml's command, such as the shell form ensure_superuser needs.
      - name: Render the chart
        run: helm template pa-expunger helm-chart -f helm-chart/ci-values.yaml

      # Cheap render-level regression checks for the migration ordering (#93) and the
      # bootstrap rerun (#92). They check the rendered manifests only, not a cluster.
      - name: Check migration gate and bootstrap revision
        run: |
          set -euo pipefail
          render() { helm template pa-expunger helm-chart -f helm-chart/ci-values.yaml "$@"; }
          job_name() { render "$@" --show-only templates/migration-job.yaml | awk '/^  name:/ {print $2; exit}'; }

          # Every command/args element must render as a string. An unquoted ": " inside a
          # list item turns it into a YAML mapping: helm lint and helm template accept that,
          # the API server rejects it, and the GitOps deploy swallows the error. yq is
          # preinstalled on GitHub's Ubuntu runners.
          types=$(render | yq ea '[.spec.template.spec | select(.) | ((.containers // []) + (.initContainers // []))[] | ((.command // []) + (.args // []))[] | type] | unique | join(",")')
          [ "$types" = '!!str' ] \
            || { echo "::error::A container command/args element is not a string (got: $types)"; exit 1; }

          # #93: backend pods wait for migrations before their app container starts.
          deployment=$(render --show-only templates/deployment.yaml)
          grep -q 'name: wait-for-migrations' <<<"$deployment" \
            || { echo "::error::Deployment has no wait-for-migrations init container"; exit 1; }
          grep -q 'manage.py migrate --check' <<<"$deployment" \
            || { echo "::error::wait-for-migrations does not run migrate --check"; exit 1; }
          # The admin credentials must stay out of the app pods, init container included:
          # no SUPERUSER_* variable, and no envFrom that would pull in the whole secret.
          if grep -Eq '(name|key): *"?SUPERUSER_|envFrom:' <<<"$deployment"; then
            echo "::error::SUPERUSER_* can reach the Deployment's environment"; exit 1
          fi

          # A failed migration Job must keep its pods (and their logs). With OnFailure the
          # Job controller deletes the pod when the Job is marked Failed.
          policy=$(render --show-only templates/migration-job.yaml | yq '.spec.template.spec.restartPolicy')
          [ "$policy" = Never ] \
            || { echo "::error::Migration Job restartPolicy is $policy, not Never"; exit 1; }

          # #92: the Job name is stable for unchanged values and changes with the revision.
          base=$(job_name)
          [ "$base" = "$(job_name)" ] || { echo "::error::Job name is not stable across renders"; exit 1; }
          case "$base" in *-r*) echo "::error::Unset bootstrapRevision added a suffix: $base"; exit 1;; esac
          bumped=$(job_name --set-string backend.bootstrapRevision=2)
          [ "$bumped" != "$base" ] || { echo "::error::bootstrapRevision did not change the Job name"; exit 1; }
          [ "$bumped" = "$(job_name --set-string backend.bootstrapRevision=2)" ] \
            || { echo "::error::Job name with bootstrapRevision is not stable"; exit 1; }
          [ "$bumped" != "$(job_name --set-string backend.bootstrapRevision=3)" ] \
            || { echo "::error::Different revisions gave the same Job name"; exit 1; }
          echo "Job name: $base; with bootstrapRevision=2: $bumped"

          # A rotation must not restart the app pods: only the Job may change.
          diff <(render --show-only templates/deployment.yaml) \
               <(render --set-string backend.bootstrapRevision=2 --show-only templates/deployment.yaml) \
            || { echo "::error::bootstrapRevision changed the Deployment"; exit 1; }

          # An invalid or over-long name must fail the render, not truncate silently.
          if render --set-string backend.bootstrapRevision=Bad_Rev >/dev/null 2>&1; then
            echo "::error::Invalid bootstrapRevision rendered"; exit 1
          fi
          if render --set-string backend.bootstrapRevision="$(printf 'r%.0s' {1..40})" >/dev/null 2>&1; then
            echo "::error::Over-long Job name rendered"; exit 1
          fi
