name: Build containers and run tests

on:
  pull_request:
    branches: [ "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Start containers
        # --wait blocks until the backend's healthcheck passes, so migrate/
        # ensure_superuser/seed_dev_data have finished before pytest runs against it.
        run: docker compose up -d --wait

      - name: Show container logs on startup failure
        if: failure()
        run: docker compose logs

      - name: Run backend tests
        run: docker compose exec -T backend pytest

      - name: Run frontend tests
        run: docker compose exec -T frontend yarn test
