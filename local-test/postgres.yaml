# A throwaway Postgres for local testing. NOT deployed anywhere real.
#
# The chart ships no database, because a database is an environment concern -- the same
# reasoning that keeps routing out of the chart. In the sandbox cluster the equivalent of
# this file is the shared CloudNativePG cluster in CodeForPhilly/cfp-sandbox-cluster: a
# Database CR in the cloudnative-pg namespace, a managed.roles entry on
# Cluster/shared-cluster, and a sealed pa-expunger-db-credentials secret. This file only
# has to be close enough to exercise the same code path, which is
# externalDatabase.host pointing at something that speaks Postgres.
#
# A Deployment with an emptyDir, not a StatefulSet with a PVC, on purpose:
#   - Local runs want a fresh database each time, so migrations are actually exercised.
#   - No PVC means nothing survives `helm uninstall` to clean up by hand.
#
# Credentials come from the Secret the chart generates under secrets.create, so they cannot
# drift from what the app is configured with. That Secret is named for the release, so this
# file assumes the release is `pa-expunger-local` -- the same assumption gateway.yaml makes
# about pa-expunger-local-tls. Apply this AFTER `helm install`, so the Secret exists.
#
# The app and the migrations Job tolerate this not being ready yet: the Job carries
# backoffLimit: 10 precisely to cover Postgres still starting.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pa-expunger-local-postgres
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pa-expunger-local-postgres
  template:
    metadata:
      labels:
        app: pa-expunger-local-postgres
    spec:
      containers:
        - name: postgres
          # Major version matches the sandbox cluster's PG 18.
          image: postgres:18-alpine
          envFrom:
            # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB -- the same keys, from the
            # same Secret, that the backend and the migrations Job read.
            - secretRef:
                name: pa-expunger-postgres-local-secret
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              # PGDATA is set to a subdirectory because the image refuses to initialise
              # into a mount point that is not empty.
              mountPath: /var/lib/postgresql
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "plse", "-d", "expunger_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pa-expunger-local-postgres
  namespace: default
spec:
  selector:
    app: pa-expunger-local-postgres
  ports:
    - port: 5432
      targetPort: 5432
