# Routing for local testing. NOT deployed anywhere real.
#
# The Helm chart ships no routing resources, because routing is environment specific.
# In the sandbox cluster the equivalent of this file is _gateways/pa-expunger.yaml in
# CodeForPhilly/cfp-sandbox-cluster, plus the shared HTTP->HTTPS redirect in
# _infra/envoy-gateway/http-redirect.yaml. That repo is the source of truth; this file
# only has to be close enough to exercise the same code paths locally.
#
# Nothing here is specific to a particular local Kubernetes distribution -- it is plain
# Gateway API and works on any cluster running Envoy Gateway. The Gateway gets a
# LoadBalancer Service, which Docker Desktop satisfies on localhost out of the box. A
# cluster that cannot satisfy one leaves it <pending>, and needs an EnvoyProxy override
# to expose the Envoy data plane some other way.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pa-expunger-local
  namespace: default
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: localhost
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: localhost
      tls:
        mode: Terminate
        certificateRefs:
          # Generated by the chart as <release>-tls when secrets.create is true, so this
          # name assumes the release is named pa-expunger-local. In the sandbox the
          # equivalent Secret is issued by cert-manager instead.
          - name: pa-expunger-local-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# Local stand-in for the cluster-wide redirect in _infra/envoy-gateway/http-redirect.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: default
spec:
  parentRefs:
    - name: pa-expunger-local
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pa-expunger-local
  namespace: default
spec:
  parentRefs:
    - name: pa-expunger-local
      sectionName: https
  hostnames:
    - localhost
  rules:
    - backendRefs:
        # Matches the Service the chart renders: <release>-backend-svc on service.port.
        - name: pa-expunger-local-backend-svc
          port: 80
